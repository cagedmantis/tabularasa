<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabularasa - Tab Manager</title>
    <link rel="stylesheet" href="manager.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>Tabularasa</h1>
                <span class="tab-count" id="tab-count">0 tabs</span>
            </div>
            <div class="header-controls">
                <button id="view-toggle" class="btn btn-secondary" title="Toggle between window and domain grouping">
                    <span class="icon">🪟</span>
                    <span class="text">Windows</span>
                </button>
                <button id="sessions-toggle" class="btn btn-secondary" title="Manage saved sessions">
                    <span class="icon">💾</span>
                    <span class="text">Sessions</span>
                </button>
                <button id="refresh-tabs" class="btn btn-secondary" title="Refresh tab list">
                    <span class="icon">🔄</span>
                    <span class="text">Refresh</span>
                </button>
            </div>
        </header>

        <!-- Search and Filters -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search tabs by title or URL..." class="search-input">
                <button id="clear-search" class="btn btn-icon" title="Clear search">
                    <span class="icon">✕</span>
                </button>
            </div>
            <div class="filter-controls">
                <select id="filter-type" class="filter-select">
                    <option value="all">All Tabs</option>
                    <option value="active">Active Tabs</option>
                    <option value="pinned">Pinned Tabs</option>
                    <option value="audible">Audible Tabs</option>
                    <option value="grouped">Grouped Tabs</option>
                </select>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Tab Management View -->
            <div id="tab-view" class="view active">
                <!-- Global Actions -->
                <div class="global-actions">
                    <div class="action-group">
                        <button id="select-all" class="btn btn-small">Select All</button>
                        <button id="deselect-all" class="btn btn-small">Deselect All</button>
                        <span id="selected-count" class="selected-count">0 selected</span>
                    </div>
                    <div class="action-group">
                        <button id="group-selected" class="btn btn-small btn-primary" disabled>Group Selected</button>
                        <button id="ungroup-selected" class="btn btn-small btn-secondary" disabled>Ungroup Selected</button>
                        <button id="move-to-new-window" class="btn btn-small" disabled>Move to New Window</button>
                    </div>
                    <div class="action-group">
                        <button id="close-selected" class="btn btn-small btn-danger" disabled>Close Selected</button>
                        <button id="close-duplicates" class="btn btn-small btn-warning">Close Duplicates</button>
                    </div>
                </div>

                <!-- Tabs Container -->
                <div id="tabs-container" class="tabs-container">
                    <!-- Tab groups will be populated here -->
                </div>

                <!-- Bottom Actions -->
                <div class="bottom-actions">
                    <button id="new-tab" class="btn btn-primary">
                        <span class="icon">➕</span>
                        New Tab
                    </button>
                    <button id="save-session" class="btn btn-secondary">
                        <span class="icon">💾</span>
                        Save Session
                    </button>
                    <button id="create-tab-group" class="btn btn-secondary">
                        <span class="icon">📁</span>
                        Create Group
                    </button>
                </div>
            </div>

            <!-- Session Management View -->
            <div id="session-view" class="view">
                <div class="session-header">
                    <h2>Saved Sessions</h2>
                    <button id="back-to-tabs" class="btn btn-secondary">
                        <span class="icon">←</span>
                        Back to Tabs
                    </button>
                </div>

                <!-- Session Save Form -->
                <div id="session-save-form" class="session-form hidden">
                    <h3>Save Current Session</h3>
                    <div class="form-group">
                        <label for="session-name">Session Name:</label>
                        <input type="text" id="session-name" placeholder="Enter session name..." class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Save:</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="save-type" value="current" checked>
                                Current Window Only
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="save-type" value="all">
                                All Windows
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button id="save-session-confirm" class="btn btn-primary">Save Session</button>
                        <button id="cancel-session-save" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>

                <!-- Sessions List -->
                <div id="sessions-list" class="sessions-list">
                    <!-- Saved sessions will be populated here -->
                </div>
            </div>
        </div>

        <!-- Group Creation Modal -->
        <div id="group-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create Tab Group</h3>
                    <button id="close-group-modal" class="btn btn-icon">
                        <span class="icon">✕</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="group-name">Group Name:</label>
                        <input type="text" id="group-name" placeholder="Enter group name..." class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="group-color">Group Color:</label>
                        <select id="group-color" class="form-select">
                            <option value="grey">Grey</option>
                            <option value="blue">Blue</option>
                            <option value="red">Red</option>
                            <option value="yellow">Yellow</option>
                            <option value="green">Green</option>
                            <option value="pink">Pink</option>
                            <option value="purple">Purple</option>
                            <option value="cyan">Cyan</option>
                            <option value="orange">Orange</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="confirm-group-creation" class="btn btn-primary">Create Group</button>
                    <button id="cancel-group-creation" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="status-message hidden">
            <span class="message-text"></span>
            <button class="close-status btn btn-icon">
                <span class="icon">✕</span>
            </button>
        </div>
    </div>

    <script src="dist/manager.js"></script>
</body>
</html>
