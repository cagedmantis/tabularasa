<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabula Rasa</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Tabula Rasa</h1>
            <div class="header-controls">
                <button id="view-toggle" class="btn btn-secondary" title="Toggle between window and domain grouping">
                    <span class="icon">🪟</span>
                    <span class="text">Windows</span>
                </button>
                <button id="sessions-toggle" class="btn btn-secondary" title="Manage saved sessions">
                    <span class="icon">💾</span>
                    <span class="text">Sessions</span>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search tabs by title or URL..." class="search-input">
            <button id="clear-search" class="btn btn-icon" title="Clear search">
                <span class="icon">✕</span>
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Tab Management View -->
            <div id="tab-view" class="view active">
                <!-- Global Actions -->
                <div class="global-actions">
                    <div class="action-group">
                        <button id="select-all" class="btn btn-small">Select All</button>
                        <button id="deselect-all" class="btn btn-small">Deselect All</button>
                    </div>
                    <div class="action-group">
                        <button id="move-to-new-window" class="btn btn-small" disabled>Move to New Window</button>
                        <button id="move-to-existing-window" class="btn btn-small" disabled>Move to Existing Window</button>
                    </div>
                    <div class="action-group">
                        <button id="close-selected" class="btn btn-small btn-danger" disabled>Close Selected</button>
                        <button id="close-duplicates" class="btn btn-small btn-warning">Close Duplicates</button>
                    </div>
                </div>

                <!-- Tabs Container -->
                <div id="tabs-container" class="tabs-container">
                    <!-- Tab groups will be populated here -->
                </div>

                <!-- Bottom Actions -->
                <div class="bottom-actions">
                    <button id="new-tab" class="btn btn-primary">
                        <span class="icon">➕</span>
                        New Tab
                    </button>
                    <button id="save-session" class="btn btn-secondary">
                        <span class="icon">💾</span>
                        Save Session
                    </button>
                </div>
            </div>

            <!-- Session Management View -->
            <div id="session-view" class="view">
                <div class="session-header">
                    <h2>Saved Sessions</h2>
                    <button id="back-to-tabs" class="btn btn-secondary">
                        <span class="icon">←</span>
                        Back to Tabs
                    </button>
                </div>

                <!-- Session Save Form -->
                <div id="session-save-form" class="session-form hidden">
                    <h3>Save Current Session</h3>
                    <div class="form-group">
                        <label for="session-name">Session Name:</label>
                        <input type="text" id="session-name" placeholder="Enter session name..." class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Save:</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="save-type" value="current" checked>
                                Current Window Only
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="save-type" value="all">
                                All Windows
                            </label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button id="save-session-confirm" class="btn btn-primary">Save Session</button>
                        <button id="cancel-session-save" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>

                <!-- Sessions List -->
                <div id="sessions-list" class="sessions-list">
                    <!-- Saved sessions will be populated here -->
                </div>
            </div>
        </div>

        <!-- Move to Window Modal -->
        <div id="move-window-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Move Tabs to Window</h3>
                    <button id="close-modal" class="btn btn-icon">
                        <span class="icon">✕</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="window-list" class="window-list">
                        <!-- Available windows will be populated here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="confirm-move" class="btn btn-primary" disabled>Move Tabs</button>
                    <button id="cancel-move" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="status-message hidden">
            <span class="message-text"></span>
            <button class="close-status btn btn-icon">
                <span class="icon">✕</span>
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
