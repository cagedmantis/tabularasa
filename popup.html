<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      max-height: 400px;
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    #tabs-list {
      max-height: 350px;
      overflow-y: auto;
    }
    
    .tab-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      margin: 4px 0;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .tab-item:hover {
      background-color: #f0f0f0;
    }
    
    .tab-title {
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .tab-url {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="header">Tabularasa</div>
  <div id="tabs-list"></div>
  <script src="dist/popup.js"></script>
</body>
</html>
