name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Every pull request, not only those targeting main, so that stacked
    # pull requests are tested too.
  schedule:
    # Weekly, so a new advisory in the toolchain is noticed even when no
    # one is opening pull requests.
    - cron: '17 6 * * 1'

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, one install: Node only runs the toolchain (the extension runs in
  # Chrome), so a Node version matrix would repeat the same checks.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    # Third-party actions are pinned to a commit, not a movable tag.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # The engines floor in package.json, and the Docker build's version.
        node-version: '22.x'
        cache: 'npm'

    # Install scripts are disabled by .npmrc.
    - name: Install dependencies
      run: npm ci

    - name: Validate manifest
      run: make validate-manifest

    # Type check and compile, test (with the coverage floor in
    # tests/jest.config.js), lint with zero warnings, then assemble exactly
    # the files that ship.
    - name: Build, test, lint and package
      run: make package

    - name: Upload extension package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extension-package
        path: dist-package/
        retention-days: 30

  # Its own job: a newly published advisory has nothing to do with the change
  # under test, so it must not turn the verify job red. It still shows up on
  # the pull request, and runs weekly on its own.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --audit-level=high

    # Every installed package carries a valid npm registry signature, so the
    # lockfile resolved to what the registry actually published.
    - name: Verify registry signatures
      run: npm audit signatures
