name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Every pull request, not only those targeting main, so that stacked
    # pull requests are tested too.
  schedule:
    # Weekly, so a new advisory in the toolchain is noticed even when no
    # one is opening pull requests.
    - cron: '17 6 * * 1'

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same Docker build as `make package` on a laptop: native TypeScript
  # compile, tests with the coverage floor, lint, manifest validation and the
  # zip. Built on two CPU architectures, so the zips can be compared.
  package:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
    # Third-party actions are pinned to a commit, not a movable tag.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build, test, lint and package
      run: make package

    - name: Upload extension package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extension-package-${{ runner.arch }}
        path: out/
        retention-days: 30

  # Two independent builds on different machines and CPU architectures must
  # produce the same zip, byte for byte.
  reproducible:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: Download both packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: extension-package-*

    - name: Compare checksums
      run: |
        cat extension-package-*/SHA256SUMS
        cmp extension-package-X64/SHA256SUMS extension-package-ARM64/SHA256SUMS

  # Its own job: a newly published advisory has nothing to do with the change
  # under test, so it must not turn the package job red. It still shows up on
  # the pull request, and runs weekly on its own.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # npm audit at --audit-level=high, then registry signature verification.
    - name: Audit dependencies
      run: make audit
